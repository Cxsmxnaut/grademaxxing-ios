name: Native iOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic core checks
        working-directory: ios
        run: swift run GrademaxxingChecks
      - name: Native project and formatting
        working-directory: ios
        run: |
          python3 scripts/generate-project.py --check
          xcrun swift-format lint --strict --recursive App Sources Tests UITests Package.swift
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'simulators.json').read_text())['devices']
          iphones = [device for runtime, entries in devices.items() if '.iOS-' in runtime for device in entries if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not iphones:
              raise SystemExit('No available iPhone simulator runtime.')
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('IOS_SIMULATOR_UDID=' + iphones[0]['udid'] + '\n')
          print('Selected ' + iphones[0]['name'])
          PY
      - name: Build and test synthetic iPhone demo
        run: |
          xcodebuild test -project ios/Grademaxxing.xcodeproj -scheme Grademaxxing \
            -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/NativeDerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          path: ${{ runner.temp }}/NativeDerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
